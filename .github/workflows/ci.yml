name: Loyalty Cucumber CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: loyalty-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    env:
      TEST_ENV: qa
      HEADLESS: 'true'
      CI: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run in-scope Cucumber features
        id: cucumber
        continue-on-error: true
        run: npm test

      - name: Generate Allure report
        if: always()
        run: npm run report:generate

      - name: Generate traceability matrix
        if: always()
        run: npm run traceability:generate

      - name: Upload Allure report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: |
            reports/allure-report/
            reports/traceability-matrix.md
            reports/cucumber-report.json
            reports/report.html
          retention-days: 30

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/traces/
          retention-days: 14
          if-no-files-found: ignore

      - name: Setup GitHub Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/allure-report

      - name: Deploy Allure report to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4

      - name: Fail job on test failures
        if: steps.cucumber.outcome == 'failure'
        run: exit 1
